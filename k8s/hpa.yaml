apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: External
      external:
        metric:
          name: api_requests_per_minute
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleUp:
      # Kubernetes 1.35 이상: 50건을 넘는 증가를 바로 판단합니다.
      tolerance: 0
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 3
          periodSeconds: 15
    scaleDown:
      tolerance: 0.1
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
