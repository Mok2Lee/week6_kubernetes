apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics
  labels:
    app: metrics
    app.kubernetes.io/part-of: week6-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-read
  labels:
    app.kubernetes.io/part-of: week6-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-read
  labels:
    app.kubernetes.io/part-of: week6-lab
subjects:
  - kind: ServiceAccount
    name: metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metrics-read
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics
  labels:
    app.kubernetes.io/part-of: week6-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics
  template:
    metadata:
      labels:
        app: metrics
    spec:
      serviceAccountName: metrics
      containers:
        - name: metrics
          image: week6_04
          imagePullPolicy: Never
          ports:
            - name: internal
              containerPort: 8000
            - name: external
              containerPort: 8443
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: internal
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: internal
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: tls
          secret:
            secretName: metrics-tls
---
apiVersion: v1
kind: Service
metadata:
  name: metrics
  labels:
    app.kubernetes.io/part-of: week6-lab
spec:
  type: ClusterIP
  selector:
    app: metrics
  ports:
    - name: internal
      port: 8000
      targetPort: internal
    - name: external
      port: 8443
      targetPort: external
