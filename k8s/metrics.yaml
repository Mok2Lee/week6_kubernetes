apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics
  labels:
    app: metrics
    app.kubernetes.io/part-of: week6-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-read
  labels:
    app.kubernetes.io/part-of: week6-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-read
  labels:
    app.kubernetes.io/part-of: week6-lab
subjects:
  - kind: ServiceAccount
    name: metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metrics-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: week6-metrics-tls
  labels:
    app.kubernetes.io/part-of: week6-lab
rules:
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    resourceNames: ["v1beta1.external.metrics.k8s.io"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: week6-metrics-tls
  labels:
    app.kubernetes.io/part-of: week6-lab
subjects:
  - kind: ServiceAccount
    name: metrics
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: week6-metrics-tls
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.external.metrics.k8s.io
  labels:
    app.kubernetes.io/part-of: week6-lab
spec:
  group: external.metrics.k8s.io
  version: v1beta1
  groupPriorityMinimum: 100
  versionPriority: 100
  service:
    namespace: default
    name: metrics
    port: 8443
  # The metrics Pod registers its own temporary CA at startup.
  # Certificate verification stays enabled; no private keys are stored here.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics
  labels:
    app.kubernetes.io/part-of: week6-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: metrics
  template:
    metadata:
      labels:
        app: metrics
    spec:
      serviceAccountName: metrics
      containers:
        - name: metrics
          image: week6_04
          imagePullPolicy: Never
          ports:
            - name: internal
              containerPort: 8000
            - name: external
              containerPort: 8443
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          startupProbe:
            httpGet:
              path: /health
              port: internal
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: internal
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: internal
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: metrics
  labels:
    app.kubernetes.io/part-of: week6-lab
spec:
  type: ClusterIP
  selector:
    app: metrics
  ports:
    - name: internal
      port: 8000
      targetPort: internal
    - name: external
      port: 8443
      targetPort: external
