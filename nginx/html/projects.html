<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캡스톤 기획 도우미</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body><main><header><p class="eyebrow">WEEK 6 · KUBERNETES PRACTICE</p><h1>캡스톤 기획 도우미</h1><p>프로젝트 예시를 찾고 소개글 분량을 확인합니다.</p><a href="/api/health" target="_blank" rel="noopener">기본 연결 확인: /api/health</a></header>
<section><h2>프로젝트 검색</h2><form id="search-form"><label for="category">분야</label><select id="category"><option value="all">전체</option><option value="web">웹</option><option value="iot">IoT</option><option value="ai">AI</option></select><label for="query">검색어</label><input id="query" placeholder="예: 예약"><button>검색</button></form><div id="search-result" class="result" aria-live="polite">분야와 검색어로 프로젝트를 찾아보세요.</div></section>
<section><h2>소개글 분량 검사</h2><form id="analyze-form"><label for="intro">프로젝트 소개글</label><textarea id="intro" maxlength="5000" placeholder="프로젝트 소개글을 입력하세요." required></textarea><button>검사</button></form><p id="analyze-result" class="result" aria-live="polite">권장 분량: 공백 포함 100~300자</p><small>분량만 확인합니다. 글의 품질을 평가하지 않습니다.</small></section><footer>nginx는 화면을 제공하고 Flask는 검색과 분석을 처리합니다.</footer></main></body></html>
